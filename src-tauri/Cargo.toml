[package]
name = "timer-app"
version = "0.1.3"
description = "Minimalist Looping Multi-Timer"
authors = ["Dimas Edra"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2.6", features = [] }

[dependencies]
tauri = { version = "2.11", features = [] }
tauri-plugin-notification = "2.4"
tauri-plugin-updater = "2.12"
tauri-plugin-process = "2.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"


